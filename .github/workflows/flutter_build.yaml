name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Build job ID
        required: true
        type: string

      userId:
        description: Telegram user ID
        required: true
        type: string

      payload:
        description: Build payload JSON
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flutter-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      # ==========================================================
      # 01 - START
      # ==========================================================

      - name: "01 • Worker start"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "        WEB TO APK BY ZIPERR"
          echo "        ADAPTIVE FLUTTER WORKER"
          echo "=========================================="
          echo "Job ID : ${{ inputs.jobId }}"
          echo "User ID: ${{ inputs.userId }}"
          echo "=========================================="

      # ==========================================================
      # 02 - PAYLOAD
      # ==========================================================

      - name: "02 • Parse payload"
        env:
          BUILD_PAYLOAD: ${{ inputs.payload }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("BUILD_PAYLOAD", "").strip()

          if not raw:
              raise SystemExit("ERROR: payload kosong")

          try:
              data = json.loads(raw)
          except Exception as exc:
              raise SystemExit(
                  f"ERROR: payload JSON invalid: {exc}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: payload harus JSON object"
              )

          source_url = (
              data.get("url")
              or data.get("sourceUrl")
              or data.get("source_url")
              or data.get("zipUrl")
              or data.get("zip_url")
          )

          if not source_url:
              raise SystemExit(
                  "ERROR: source ZIP URL tidak ditemukan"
              )

          build_type = str(
              data.get("buildType")
              or data.get("build_type")
              or "release"
          ).lower().strip()

          if build_type not in (
              "release",
              "debug",
              "profile"
          ):
              build_type = "release"

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  f"SOURCE_URL={source_url}\n"
              )

              env.write(
                  f"BUILD_TYPE={build_type}\n"
              )

          print("Payload          : OK")
          print("Build type       :", build_type)
          print("Source URL       : FOUND")
          PY

      # ==========================================================
      # 03 - PUB CACHE
      # ==========================================================

      - name: "03 • Prepare Pub cache"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.pub-cache"

          echo "PUB_CACHE=$HOME/.pub-cache" \
            >> "$GITHUB_ENV"

          echo "PUB_CACHE=$HOME/.pub-cache"

      # ==========================================================
      # 04 - DOWNLOAD
      # ==========================================================

      - name: "04 • Download source ZIP"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          rm -f source.zip

          if [ -z "${SOURCE_URL:-}" ]; then
            echo "ERROR: SOURCE_URL kosong"
            exit 1
          fi

          echo "Downloading source ZIP..."

          curl \
            --fail \
            --show-error \
            --location \
            --retry 6 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${SOURCE_URL}" \
            -o source.zip

          test -f source.zip

          SIZE="$(stat -c '%s' source.zip)"

          echo "ZIP size: ${SIZE} bytes"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: source ZIP terlalu kecil"
            file source.zip || true
            exit 1
          fi

      # ==========================================================
      # 05 - ZIP VALIDATION
      # ==========================================================

      - name: "05 • Validate ZIP"
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath

          path = "source.zip"

          if not zipfile.is_zipfile(path):
              raise SystemExit(
                  "ERROR: source.zip bukan ZIP valid"
              )

          with zipfile.ZipFile(path) as archive:

              bad = archive.testzip()

              if bad:
                  raise SystemExit(
                      f"ERROR: ZIP corrupt: {bad}"
                  )

              for item in archive.infolist():

                  name = item.filename.replace("\\", "/")
                  parts = PurePosixPath(name).parts

                  if name.startswith("/"):
                      raise SystemExit(
                          f"ERROR: absolute path: {name}"
                      )

                  if ".." in parts:
                      raise SystemExit(
                          f"ERROR: unsafe ZIP path: {name}"
                      )

          print("ZIP validation: OK")
          PY

      # ==========================================================
      # 06 - EXTRACT
      # ==========================================================

      - name: "06 • Extract source"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source

          unzip -q source.zip -d source

          echo "Source extracted."

          echo
          echo "Flutter projects found:"

          find source \
            -type f \
            -name pubspec.yaml \
            -print \
            | head -30

      # ==========================================================
      # 07 - FIND PROJECT
      # ==========================================================

      - name: "07 • Locate Flutter project"
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          while IFS= read -r pubspec; do

            DIR="$(dirname "$pubspec")"

            if [ -d "$DIR/lib" ] &&
               [ -d "$DIR/android" ]; then

              PROJECT_ROOT="$DIR"
              break

            fi

          done < <(
            find "$PWD/source" \
              -type f \
              -name pubspec.yaml \
              | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then

            echo "ERROR: Flutter project tidak ditemukan."

            echo
            echo "pubspec.yaml yang ditemukan:"

            find source \
              -type f \
              -name pubspec.yaml \
              -print \
              || true

            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" \
            >> "$GITHUB_ENV"

          echo
          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"

      # ==========================================================
      # 08 - FLUTTER REVISION
      #
      # IMPORTANT:
      # Tidak menggunakan Python regex.
      # Tidak ada quote escaping yang rawan syntax error.
      # ==========================================================

      - name: "08 • Detect original Flutter revision"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          FLUTTER_REVISION=""

          if [ -f ".metadata" ]; then

            FLUTTER_REVISION="$(
              awk '
                /^[[:space:]]+revision:/ {
                  value=$0
                  sub(/^[[:space:]]+revision:[[:space:]]*/, "", value)
                  gsub(/["'\'']/, "", value)
                  print value
                  exit
                }
              ' .metadata
            )"

          fi

          FLUTTER_REVISION="$(
            echo "$FLUTTER_REVISION" |
            tr -d '[:space:]'
          )"

          echo "=========================================="
          echo " FLUTTER REVISION DETECTION"
          echo "=========================================="

          if [ -n "$FLUTTER_REVISION" ]; then

            echo "FOUND:"
            echo "$FLUTTER_REVISION"

          else

            echo "NOT FOUND"

          fi

          echo
          echo "FLUTTER_REVISION=$FLUTTER_REVISION" \
            >> "$GITHUB_ENV"

      # ==========================================================
      # 09 - SETUP ORIGINAL FLUTTER
      # ==========================================================

      - name: "09 • Setup original Flutter"
        if: env.FLUTTER_REVISION != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_REVISION }}
          channel: stable
          cache: true

      # ==========================================================
      # 10 - FALLBACK
      # ==========================================================

      - name: "10 • Flutter stable fallback"
        if: env.FLUTTER_REVISION == ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================================
      # 11 - VERIFY FLUTTER
      # ==========================================================

      - name: "11 • Verify Flutter"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FLUTTER SDK"
          echo "=========================================="

          echo
          echo "Flutter:"
          flutter --version

          echo
          echo "Dart:"
          dart --version

          echo
          echo "Flutter root:"
          echo "${FLUTTER_ROOT}"

          echo
          echo "Requested revision:"
          echo "${FLUTTER_REVISION:-NONE}"

      # ==========================================================
      # 12 - DETECT GRADLE
      # ==========================================================

      - name: "12 • Detect Gradle"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper tidak ditemukan"
            exit 1
          fi

          GRADLE_VERSION="$(
            sed -nE \
              's/.*gradle-([0-9]+([.][0-9]+){1,2})-.*/\1/p' \
              "$WRAPPER" \
              | head -n 1
          )"

          if [ -z "$GRADLE_VERSION" ]; then
            echo "WARNING: versi Gradle tidak terbaca"
          fi

          echo "GRADLE_VERSION=$GRADLE_VERSION" \
            >> "$GITHUB_ENV"

          echo "Gradle:"
          echo "${GRADLE_VERSION:-UNKNOWN}"

      # ==========================================================
      # 13 - DETECT AGP
      # ==========================================================

      - name: "13 • Detect AGP"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          AGP_VERSION="$(
            grep -RhoE \
              'com\.android\.tools\.build:gradle:[0-9.]+' \
              android \
              2>/dev/null \
              | head -n 1 \
              | sed 's/.*://' \
              || true
          )"

          if [ -z "$AGP_VERSION" ]; then

            AGP_VERSION="$(
              grep -RhoE \
                'com\.android\.application[^[:space:]]*[[:space:]]*version[[:space:]]*["'\''][0-9.]+["'\'']' \
                android \
                2>/dev/null \
                | head -n 1 \
                | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' \
                | tail -n 1 \
                || true
            )"

          fi

          echo "AGP_VERSION=$AGP_VERSION" \
            >> "$GITHUB_ENV"

          echo "AGP:"
          echo "${AGP_VERSION:-UNKNOWN}"

      # ==========================================================
      # 14 - DETECT KOTLIN
      # ==========================================================

      - name: "14 • Detect Kotlin"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          KOTLIN_VERSION="$(
            grep -RhoE \
              'kotlin-gradle-plugin:[0-9.]+' \
              android \
              2>/dev/null \
              | head -n 1 \
              | sed 's/.*://' \
              || true
          )"

          if [ -z "$KOTLIN_VERSION" ]; then

            KOTLIN_VERSION="$(
              grep -RhoE \
                'kotlin.*version[[:space:]]*["'\''][0-9.]+["'\'']' \
                android \
                2>/dev/null \
                | head -n 1 \
                | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' \
                | tail -n 1 \
                || true
            )"

          fi

          echo "KOTLIN_VERSION=$KOTLIN_VERSION" \
            >> "$GITHUB_ENV"

          echo "Kotlin:"
          echo "${KOTLIN_VERSION:-UNKNOWN}"

      # ==========================================================
      # 15 - JAVA
      # ==========================================================

      - name: "15 • Select Java"
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GRADLE_VERSION:-}"

          MAJOR="$(
            echo "$VERSION" |
            cut -d. -f1
          )"

          MINOR="$(
            echo "$VERSION" |
            cut -d. -f2
          )"

          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"

          if [ "$MAJOR" -lt 7 ]; then

            JAVA_VERSION="11"

          elif [ "$MAJOR" -eq 7 ] &&
               [ "$MINOR" -lt 3 ]; then

            JAVA_VERSION="11"

          else

            JAVA_VERSION="17"

          fi

          echo "JAVA_VERSION=$JAVA_VERSION" \
            >> "$GITHUB_ENV"

          echo "Selected Java: $JAVA_VERSION"

      # ==========================================================
      # 16 - JAVA SETUP
      # ==========================================================

      - name: "16 • Setup Java"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ==========================================================
      # 17 - TOOLCHAIN
      # ==========================================================

      - name: "17 • Verify Android toolchain"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          cd "$PROJECT_ROOT"

          chmod +x android/gradlew

          cd android

          ./gradlew --version

      # ==========================================================
      # 18 - BACKUP
      # ==========================================================

      - name: "18 • Backup Android project"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf android.worker-original

          cp -a android android.worker-original

          echo "Original Android project backed up."

      # ==========================================================
      # 19 - DIAGNOSTICS
      # ==========================================================

      - name: "19 • Flutter diagnostics"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter doctor -v \
            2>&1 | tee flutter_doctor.log || true

          flutter analyze --suggestions \
            2>&1 | tee flutter_suggestions.log || true

      # ==========================================================
      # 20 - BUILD
      # ==========================================================

      - name: "20 • Build original project"
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_ROOT"

          rm -f flutter_build.log

          echo "=========================================="
          echo " BUILD ORIGINAL PROJECT"
          echo "=========================================="

          echo
          echo "Flutter:"
          flutter --version

          echo
          echo "Gradle:"
          cd android
          ./gradlew --version
          cd ..

          echo
          echo "AGP    : ${AGP_VERSION:-UNKNOWN}"
          echo "Kotlin : ${KOTLIN_VERSION:-UNKNOWN}"
          echo "Java   : ${JAVA_VERSION}"

          echo
          echo "Running flutter pub get..."

          flutter pub get

          echo
          echo "Running APK build..."

          case "$BUILD_TYPE" in

            debug)

              flutter build apk \
                --debug \
                --no-pub \
                2>&1 | tee flutter_build.log

              ;;

            profile)

              flutter build apk \
                --profile \
                --no-pub \
                2>&1 | tee flutter_build.log

              ;;

            release|*)

              flutter build apk \
                --release \
                --no-pub \
                2>&1 | tee flutter_build.log

              ;;

          esac

      # ==========================================================
      # 21 - COLLECT APK
      # ==========================================================

      - name: "21 • Collect APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf "$GITHUB_WORKSPACE/output"

          mkdir -p "$GITHUB_WORKSPACE/output"

          find build/app/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          if ! find "$GITHUB_WORKSPACE/output" \
              -type f \
              -name "*.apk" \
              | grep -q .; then

            echo "ERROR: APK tidak ditemukan"

            find build \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo " APK SUCCESS"
          echo "=========================================="

          ls -lh \
            "$GITHUB_WORKSPACE"/output/*.apk

      # ==========================================================
      # 22 - UPLOAD APK
      # ==========================================================

      - name: "22 • Upload APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

      # ==========================================================
      # 23 - DIAGNOSTICS ARTIFACT
      # ==========================================================

      - name: "23 • Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.jobId }}
          path: |
            ${{ env.PROJECT_ROOT }}/flutter_build.log
            ${{ env.PROJECT_ROOT }}/flutter_doctor.log
            ${{ env.PROJECT_ROOT }}/flutter_suggestions.log
            ${{ env.PROJECT_ROOT }}/pubspec.yaml
            ${{ env.PROJECT_ROOT }}/pubspec.lock
            ${{ env.PROJECT_ROOT }}/.metadata
            ${{ env.PROJECT_ROOT }}/android/gradle/wrapper/gradle-wrapper.properties
            ${{ env.PROJECT_ROOT }}/android/build.gradle
            ${{ env.PROJECT_ROOT }}/android/build.gradle.kts
            ${{ env.PROJECT_ROOT }}/android/settings.gradle
            ${{ env.PROJECT_ROOT }}/android/settings.gradle.kts
            ${{ env.PROJECT_ROOT }}/android/app/build.gradle
            ${{ env.PROJECT_ROOT }}/android/app/build.gradle.kts
            ${{ env.PROJECT_ROOT }}/android/app/src/main/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
          overwrite: true
