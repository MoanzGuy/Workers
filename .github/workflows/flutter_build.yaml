name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flutter-build-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    name: Adaptive Flutter APK Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:

      - name: "01 • Worker"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " WEB TO APK BY ZIPERR"
          echo " ADAPTIVE FLUTTER BUILD WORKER"
          echo "=========================================="
          echo "Job ID : ${{ inputs.jobId }}"
          echo "User ID: ${{ inputs.userId }}"
          echo "Runner : $RUNNER_OS"
          echo "=========================================="

      - name: "02 • Parse payload"
        shell: bash
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re

          raw = os.environ.get("PAYLOAD", "").strip()

          if not raw:
              raise SystemExit("ERROR: payload kosong")

          try:
              data = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"ERROR: payload JSON invalid: {e}")

          if not isinstance(data, dict):
              raise SystemExit("ERROR: payload harus object JSON")

          url = (
              data.get("url")
              or data.get("sourceUrl")
              or data.get("source_url")
              or data.get("zipUrl")
              or data.get("zip_url")
          )

          if not url:
              raise SystemExit("ERROR: source ZIP URL tidak ditemukan")

          build_type = str(
              data.get("buildType")
              or data.get("build_type")
              or "release"
          ).lower()

          if build_type not in ("release", "debug", "profile"):
              build_type = "release"

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SOURCE_URL={url}\n")
              f.write(f"BUILD_TYPE={build_type}\n")

          print("Payload OK")
          print("Build type:", build_type)
          PY

      - name: "03 • Download source"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf source.zip source project

          if [ -z "${SOURCE_URL:-}" ]; then
            echo "ERROR: SOURCE_URL kosong"
            exit 1
          fi

          HOST="$(
            python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          print(urlparse(os.environ["SOURCE_URL"]).netloc.lower())
          PY
          )"

          echo "Source host: $HOST"

          if [[ "$HOST" == "github.com" || "$HOST" == "api.github.com" ]]; then
            curl \
              --fail \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 30 \
              --max-time 600 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "$SOURCE_URL" \
              -o source.zip
          else
            curl \
              --fail \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 30 \
              --max-time 600 \
              "$SOURCE_URL" \
              -o source.zip
          fi

          SIZE="$(stat -c%s source.zip)"

          echo "ZIP size: $SIZE bytes"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: ZIP terlalu kecil"
            exit 1
          fi

      - name: "04 • Validate ZIP"
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath

          if not zipfile.is_zipfile("source.zip"):
              raise SystemExit("ERROR: source bukan ZIP valid")

          with zipfile.ZipFile("source.zip") as z:

              bad = z.testzip()

              if bad:
                  raise SystemExit(
                      f"ERROR: ZIP corrupt: {bad}"
                  )

              for item in z.infolist():

                  name = item.filename.replace("\\", "/")
                  path = PurePosixPath(name)

                  if name.startswith("/"):
                      raise SystemExit(
                          f"ERROR: absolute ZIP path: {name}"
                      )

                  if ".." in path.parts:
                      raise SystemExit(
                          f"ERROR: ZIP path traversal: {name}"
                      )

          print("ZIP validation OK")
          PY

      - name: "05 • Extract"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source
          mkdir source

          unzip -q source.zip -d source

          test -d source

      - name: "06 • Find Flutter project"
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          while IFS= read -r pubspec; do

            DIR="$(dirname "$pubspec")"

            if [ -d "$DIR/lib" ] &&
               [ -d "$DIR/android" ]; then

              PROJECT_ROOT="$DIR"
              break
            fi

          done < <(
            find "$PWD/source" \
              -type f \
              -name pubspec.yaml \
              | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then

            echo "ERROR: Flutter project tidak ditemukan."

            find source \
              -type f \
              -name pubspec.yaml \
              -print || true

            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_ROOT"

      - name: "07 • Prepare project"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir project

          cp -a "$PROJECT_ROOT"/. project/

          test -f project/pubspec.yaml
          test -d project/lib
          test -d project/android

          echo "Project prepared."

      - name: "08 • Detect Android toolchain"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          echo "=========================================="
          echo " DETECTING ORIGINAL ANDROID TOOLCHAIN"
          echo "=========================================="

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper tidak ditemukan"
            exit 1
          fi

          GRADLE_VERSION="$(
            python3 - "$WRAPPER" <<'PY'
          import re
          import sys

          text = open(
              sys.argv[1],
              encoding="utf-8"
          ).read()

          m = re.search(
              r"gradle-([0-9]+(?:\.[0-9]+){1,2})-",
              text
          )

          print(m.group(1) if m else "")
          PY
          )"

          AGP_VERSION="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
          ]

          patterns = [
              r'com\.android\.application["\']?\s*(?:version\s*)?["\']([0-9.]+)["\']',
              r'com\.android\.tools\.build:gradle:([0-9.]+)',
              r'com\.android\.application.*?version\s*[= ]\s*["\']([0-9.]+)["\']',
          ]

          for path in files:

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              for pattern in patterns:

                  m = re.search(
                      pattern,
                      text,
                      re.I | re.S
                  )

                  if m:
                      print(m.group(1))
                      raise SystemExit

          print("")
          PY
          )"

          KOTLIN_VERSION="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
          ]

          patterns = [
              r'kotlin.*?version\s*[= ]\s*["\']([0-9.]+)["\']',
              r'kotlin_version\s*=\s*["\']([0-9.]+)["\']',
              r'kotlin-gradle-plugin:([0-9.]+)',
          ]

          for path in files:

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              for pattern in patterns:

                  m = re.search(
                      pattern,
                      text,
                      re.I | re.S
                  )

                  if m:
                      print(m.group(1))
                      raise SystemExit

          print("")
          PY
          )"

          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"
          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"
          echo "KOTLIN_VERSION=$KOTLIN_VERSION" >> "$GITHUB_ENV"

          echo
          echo "Original Gradle : ${GRADLE_VERSION:-unknown}"
          echo "Original AGP    : ${AGP_VERSION:-unknown}"
          echo "Original Kotlin : ${KOTLIN_VERSION:-unknown}"

      - name: "09 • Select compatible Java"
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GRADLE_VERSION:-}"

          MAJOR="$(
            echo "$VERSION" |
              cut -d. -f1
          )"

          MINOR="$(
            echo "$VERSION" |
              cut -d. -f2
          )"

          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"

          echo "Gradle major: $MAJOR"
          echo "Gradle minor: $MINOR"

          # Gradle < 7.3 cannot reliably run on Java 17.
          # Old Flutter projects therefore get Java 11.
          if [ "$MAJOR" -lt 7 ] ||
             { [ "$MAJOR" -eq 7 ] && [ "$MINOR" -lt 3 ]; }; then

            echo "JAVA_BUILD_VERSION=11" >> "$GITHUB_ENV"

            echo "Selected Java 11"
            echo "Reason: old Gradle"

          else

            echo "JAVA_BUILD_VERSION=17" >> "$GITHUB_ENV"

            echo "Selected Java 17"
            echo "Reason: modern Gradle"

          fi

      - name: "10 • Setup selected Java"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_BUILD_VERSION }}

      - name: "11 • Verify Java"
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_BUILD_VERSION=$JAVA_BUILD_VERSION"
          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version

      - name: "12 • Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: "13 • Flutter compatibility analysis"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          flutter --version
          dart --version

          echo
          echo "Running Flutter compatibility analysis..."

          flutter analyze --suggestions \
            2>&1 | tee flutter_suggestions.log || true

          echo
          echo "Original Gradle : ${GRADLE_VERSION:-unknown}"
          echo "Original AGP    : ${AGP_VERSION:-unknown}"
          echo "Original Kotlin : ${KOTLIN_VERSION:-unknown}"

      - name: "14 • Preserve old project"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          cp -a android android.worker-backup

          if [ -f pubspec.yaml ]; then
            cp pubspec.yaml pubspec.worker-backup.yaml
          fi

      - name: "15 • Prepare Gradle without forced upgrade"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          chmod +x android/gradlew

          echo "=========================================="
          echo " ORIGINAL GRADLE PRESERVED"
          echo "=========================================="

          ./android/gradlew --version

      - name: "16 • Android manifest check"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          try:
              tree = ET.parse(sys.argv[1])
          except Exception as e:
              raise SystemExit(
                  f"ERROR: AndroidManifest invalid: {e}"
              )

          if tree.getroot().tag != "manifest":
              raise SystemExit(
                  "ERROR: invalid manifest root"
              )

          print("Manifest OK")
          PY

      - name: "17 • Flutter dependencies"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          flutter pub get

      - name: "18 • Build APK"
        id: original_build
        shell: bash
        run: |
          set -o pipefail

          cd project

          rm -f flutter_build.log

          echo "=========================================="
          echo " BUILDING ORIGINAL PROJECT"
          echo "=========================================="

          case "$BUILD_TYPE" in

            debug)
              flutter build apk \
                --debug \
                --no-pub \
                2>&1 | tee flutter_build.log
              ;;

            profile)
              flutter build apk \
                --profile \
                --no-pub \
                2>&1 | tee flutter_build.log
              ;;

            *)
              flutter build apk \
                --release \
                --no-pub \
                2>&1 | tee flutter_build.log
              ;;

          esac

      - name: "19 • Compatibility repair"
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          cd project

          echo "=========================================="
          echo " ORIGINAL BUILD FAILED"
          echo " STARTING SAFE COMPATIBILITY REPAIR"
          echo "=========================================="

          cp -a android.worker-backup/. android/

          python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
          ]

          print("Scanning Android Gradle files...")

          for path in files:

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              # Kotlin versions below Flutter's minimum
              # are raised conservatively.
              text = re.sub(
                  r'(kotlin_version\s*=\s*[\'"])[0-9.]+([\'"])',
                  r'\g<1>1.9.24\2',
                  text
              )

              text = re.sub(
                  r'(kotlin[^\n]*version\s*[=:]\s*[\'"])[0-9.]+([\'"])',
                  r'\g<1>1.9.24\2',
                  text,
                  flags=re.I
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

              print("Checked:", path)

          PY

          chmod +x android/gradlew

          echo
          echo "Retrying dependency resolution..."

          flutter pub get

      - name: "20 • Build after compatibility repair"
        if: failure()
        shell: bash
        run: |
          set -o pipefail

          cd project

          echo "=========================================="
          echo " BUILD RETRY"
          echo "=========================================="

          rm -f flutter_build_retry.log

          case "$BUILD_TYPE" in

            debug)
              flutter build apk \
                --debug \
                --no-pub \
                2>&1 | tee flutter_build_retry.log
              ;;

            profile)
              flutter build apk \
                --profile \
                --no-pub \
                2>&1 | tee flutter_build_retry.log
              ;;

            *)
              flutter build apk \
                --release \
                --no-pub \
                2>&1 | tee flutter_build_retry.log
              ;;

          esac

      - name: "21 • Find APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          find project/build/app/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} output/ \;

          COUNT="$(
            find output \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          echo
          echo "APK:"
          ls -lh output/*.apk

      - name: "22 • Upload APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

      - name: "23 • Diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.jobId }}
          path: |
            project/flutter_build.log
            project/flutter_build_retry.log
            project/flutter_suggestions.log
            project/pubspec.yaml
            project/pubspec.lock
            project/android/gradle/wrapper/gradle-wrapper.properties
            project/android/build.gradle
            project/android/build.gradle.kts
            project/android/settings.gradle
            project/android/settings.gradle.kts
            project/android/app/build.gradle
            project/android/app/build.gradle.kts
            project/android/app/src/main/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
          overwrite: true
