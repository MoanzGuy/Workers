name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "SC Build Job ID"
        required: true
        type: string
      userId:
        description: "Telegram User ID"
        required: true
        type: string
      payload:
        description: "SC Build JSON payload"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: flutter-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}
      FLUTTER_CHANNEL: stable
      JAVA_VERSION: "17"

    steps:
      - name: 01 - Initialize
        run: |
          set -euo pipefail
          echo "SC BUILD - FLUTTER WORKER"
          echo "Job ID: $JOB_ID"
          echo "User ID: $USER_ID"
          echo "Run ID: $GITHUB_RUN_ID"

      - name: 02 - Parse payload
        id: payload
        shell: bash
        env:
          RAW_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          raw = os.environ["RAW_PAYLOAD"]

          try:
              data = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"Invalid payload JSON: {e}")

          url = str(data.get("url", "")).strip()

          tag = str(
              data.get("tag")
              or data.get("jobId")
              or os.environ.get("GITHUB_RUN_ID")
          ).strip()

          build_type = str(
              data.get("buildType")
              or data.get("mode")
              or "release"
          ).strip().lower()

          if not url:
              raise SystemExit("payload.url kosong")

          if not url.startswith(("http://", "https://")):
              raise SystemExit("payload.url harus http:// atau https://")

          if build_type not in ("release", "debug"):
              build_type = "release"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"url={url}\n")
              f.write(f"tag={tag}\n")
              f.write(f"build_type={build_type}\n")
          PY

      - name: 03 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 04 - Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 05 - Verify tools
        run: |
          set -euo pipefail
          flutter --version
          java -version

      - name: 06 - Download source ZIP
        env:
          SOURCE_URL: ${{ steps.payload.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -f source.zip

          curl \
            --fail \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -o source.zip \
            "$SOURCE_URL"

          test -s source.zip

          SIZE="$(stat -c%s source.zip)"
          echo "Source size: ${SIZE} bytes"

          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Source ZIP terlalu kecil."
            exit 1
          fi

      - name: 07 - Extract source
        run: |
          set -euo pipefail

          rm -rf extracted project
          mkdir -p extracted project

          unzip -q source.zip -d extracted

          PUBSPEC="$(
            find extracted \
              -type f \
              -name "pubspec.yaml" \
              -print \
              -quit
          )"

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan."
            find extracted -maxdepth 4 -type f | head -150
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PUBSPEC")"

          echo "Project root: $PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. project/

          test -f project/pubspec.yaml
          test -d project/android

      - name: 08 - Prepare Flutter project
        working-directory: project
        run: |
          set -euo pipefail
          bash ../scripts/build_flutter.sh prepare

      - name: 09 - Flutter dependencies
        working-directory: project
        run: |
          set -euo pipefail
          flutter pub get

      - name: 10 - Build APK
        working-directory: project
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        run: |
          set -euo pipefail
          bash ../scripts/build_flutter.sh build

      - name: 11 - Collect APK
        id: apk
        env:
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          set -euo pipefail

          APK="$(
            find project/build/app/outputs \
              -type f \
              -name "*.apk" \
              -print \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          mkdir -p output

          SAFE_TAG="$(echo "$TAG" | tr -c 'A-Za-z0-9._-' '_')"
          DEST="output/flutter-${SAFE_TAG}.apk"

          cp "$APK" "$DEST"

          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=flutter-${SAFE_TAG}" >> "$GITHUB_OUTPUT"

          ls -lh "$DEST"

      - name: 12 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 2

      - name: 13 - Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.jobId }}
          path: |
            project/flutter_build.log
            project/build
          if-no-files-found: warn
          retention-days: 2
