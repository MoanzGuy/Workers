name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flutter-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      PUB_CACHE: ${{ runner.temp }}/pub-cache

    steps:

      - name: "01 • Start"
        run: |
          set -euo pipefail
          echo "=========================================="
          echo " WEB TO APK BY ZIPERR"
          echo " ADAPTIVE FLUTTER WORKER"
          echo "=========================================="
          echo "Job ID : ${{ inputs.jobId }}"
          echo "User ID: ${{ inputs.userId }}"

      - name: "02 • Parse payload"
        env:
          BUILD_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          raw = os.environ["BUILD_PAYLOAD"].strip()

          if not raw:
              raise SystemExit("ERROR: payload kosong")

          try:
              data = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"ERROR: payload JSON invalid: {e}")

          if not isinstance(data, dict):
              raise SystemExit("ERROR: payload harus object")

          url = (
              data.get("url")
              or data.get("sourceUrl")
              or data.get("source_url")
              or data.get("zipUrl")
              or data.get("zip_url")
          )

          if not url:
              raise SystemExit("ERROR: source ZIP URL tidak ditemukan")

          build_type = str(
              data.get("buildType")
              or data.get("build_type")
              or "release"
          ).lower().strip()

          if build_type not in ("release", "debug", "profile"):
              build_type = "release"

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(f"SOURCE_URL={url}\n")
              f.write(f"BUILD_TYPE={build_type}\n")

          print("Payload OK")
          print("Build type:", build_type)
          PY

      - name: "03 • Download source"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf source source.zip

          curl \
            --fail \
            --show-error \
            --location \
            --retry 6 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$SOURCE_URL" \
            -o source.zip

          SIZE="$(stat -c%s source.zip)"

          echo "ZIP size: ${SIZE} bytes"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: ZIP terlalu kecil"
            file source.zip || true
            exit 1
          fi

      - name: "04 • Validate ZIP"
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath

          if not zipfile.is_zipfile("source.zip"):
              raise SystemExit("ERROR: ZIP tidak valid")

          with zipfile.ZipFile("source.zip") as z:

              bad = z.testzip()

              if bad:
                  raise SystemExit(f"ERROR: ZIP corrupt: {bad}")

              for item in z.infolist():

                  name = item.filename.replace("\\", "/")
                  parts = PurePosixPath(name).parts

                  if name.startswith("/"):
                      raise SystemExit(
                          f"ERROR: absolute path: {name}"
                      )

                  if ".." in parts:
                      raise SystemExit(
                          f"ERROR: unsafe path: {name}"
                      )

          print("ZIP validation OK")
          PY

      - name: "05 • Extract source"
        run: |
          set -euo pipefail

          mkdir -p source
          unzip -q source.zip -d source

      - name: "06 • Locate Flutter project"
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          while IFS= read -r pubspec; do
            dir="$(dirname "$pubspec")"

            if [ -d "$dir/lib" ] &&
               [ -d "$dir/android" ]; then
              PROJECT_ROOT="$dir"
              break
            fi
          done < <(
            find "$PWD/source" \
              -type f \
              -name pubspec.yaml \
              | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Flutter project tidak ditemukan"
            find source \
              -type f \
              -name pubspec.yaml \
              -print || true
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "PROJECT_ROOT=$PROJECT_ROOT"

      # ----------------------------------------------------------
      # PENTING:
      # .metadata biasanya menyimpan Git revision Flutter,
      # bukan angka 3.xx.x.
      # ----------------------------------------------------------

      - name: "07 • Detect original Flutter revision"
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          FLUTTER_REVISION=""

          if [ -f ".metadata" ]; then
            FLUTTER_REVISION="$(
              python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path(".metadata").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # Ambil revision di bagian version:
          # version:
          #   revision: "xxxxxxxx"
          m = re.search(
              r'(?ms)^version:\s*\n'
              r'(?:[ \t]+.*\n)*?'
              r'[ \t]+revision:\s*["\']?'
              r'([0-9a-f]{7,40})["\']?\s*$',
              text,
              re.I
          )

          if m:
              print(m.group(1))
          PY
            )"
          fi

          echo "Detected Flutter revision:"
          echo "${FLUTTER_REVISION:-NONE}"

          echo "FLUTTER_REVISION=$FLUTTER_REVISION" \
            >> "$GITHUB_ENV"

      - name: "08 • Setup original Flutter revision"
        if: env.FLUTTER_REVISION != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_REVISION }}
          channel: stable
          cache: true

      - name: "09 • Flutter fallback"
        if: env.FLUTTER_REVISION == ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: "10 • Verify Flutter"
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FLUTTER SDK"
          echo "=========================================="

          flutter --version
          dart --version

          echo
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"

          echo
          echo "Requested revision:"
          echo "${FLUTTER_REVISION:-NONE}"

      - name: "11 • Detect Gradle"
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper tidak ditemukan"
            exit 1
          fi

          GRADLE_VERSION="$(
            python3 - "$WRAPPER" <<'PY'
          import re
          import sys

          text = open(
              sys.argv[1],
              encoding="utf-8",
              errors="ignore"
          ).read()

          m = re.search(
              r'gradle-([0-9]+(?:\.[0-9]+){1,2})-',
              text
          )

          print(m.group(1) if m else "")
          PY
          )"

          echo "GRADLE_VERSION=$GRADLE_VERSION" \
            >> "$GITHUB_ENV"

          echo "Gradle: ${GRADLE_VERSION:-UNKNOWN}"

      - name: "12 • Detect AGP"
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          AGP_VERSION="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts")
          ]

          patterns = [
              r'com\.android\.application.*?version\s*["\']([0-9.]+)',
              r'com\.android\.tools\.build:gradle:([0-9.]+)',
              r'com\.android\.application["\']?\s*,?\s*version\s*["\']([0-9.]+)'
          ]

          for path in files:

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      text,
                      re.I | re.S
                  )

                  if match:
                      print(match.group(1))
                      raise SystemExit

          print("")
          PY
          )"

          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"

          echo "AGP: ${AGP_VERSION:-UNKNOWN}"

      - name: "13 • Detect Kotlin"
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          KOTLIN_VERSION="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts")
          ]

          patterns = [
              r'org\.jetbrains\.kotlin\.android.*?version\s*["\']([0-9.]+)',
              r'kotlin.*?version\s*[=:]\s*["\']([0-9.]+)',
              r'kotlin-gradle-plugin:([0-9.]+)',
              r'kotlin_version\s*=\s*["\']([0-9.]+)'
          ]

          for path in files:

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      text,
                      re.I | re.S
                  )

                  if match:
                      print(match.group(1))
                      raise SystemExit

          print("")
          PY
          )"

          echo "KOTLIN_VERSION=$KOTLIN_VERSION" \
            >> "$GITHUB_ENV"

          echo "Kotlin: ${KOTLIN_VERSION:-UNKNOWN}"

      - name: "14 • Select Java"
        run: |
          set -euo pipefail

          VERSION="${GRADLE_VERSION:-0}"

          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"

          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"

          if [ "$MAJOR" -lt 7 ]; then
            JAVA_VERSION="11"
          elif [ "$MAJOR" -eq 7 ] &&
               [ "$MINOR" -lt 3 ]; then
            JAVA_VERSION="11"
          else
            JAVA_VERSION="17"
          fi

          echo "JAVA_VERSION=$JAVA_VERSION" \
            >> "$GITHUB_ENV"

          echo "Selected Java: $JAVA_VERSION"

      - name: "15 • Setup Java"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: "16 • Verify Android toolchain"
        run: |
          set -euo pipefail

          java -version
          echo

          cd "$PROJECT_ROOT"

          chmod +x android/gradlew

          cd android

          ./gradlew --version

      - name: "17 • Backup Android project"
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf android.worker-original

          cp -a android android.worker-original

          echo "Original Android project backed up."

      - name: "18 • Flutter doctor and suggestions"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter doctor -v \
            2>&1 | tee flutter_doctor.log || true

          flutter analyze --suggestions \
            2>&1 | tee flutter_suggestions.log || true

      - name: "19 • Build original project"
        id: build_original
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_ROOT"

          rm -f flutter_build.log

          echo "=========================================="
          echo " BUILD ORIGINAL PROJECT"
          echo "=========================================="

          echo "Flutter:"
          flutter --version

          echo
          echo "Gradle:"
          cd android
          ./gradlew --version
          cd ..

          echo
          echo "AGP    : ${AGP_VERSION:-UNKNOWN}"
          echo "Kotlin : ${KOTLIN_VERSION:-UNKNOWN}"
          echo "Java   : ${JAVA_VERSION}"

          flutter pub get

          case "$BUILD_TYPE" in

            debug)
              flutter build apk \
                --debug \
                --no-pub \
                2>&1 | tee flutter_build.log
              ;;

            profile)
              flutter build apk \
                --profile \
                --no-pub \
                2>&1 | tee flutter_build.log
              ;;

            release|*)
              flutter build apk \
                --release \
                --no-pub \
                2>&1 | tee flutter_build.log
              ;;

          esac

      - name: "20 • Collect APK"
        if: success()
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/output"

          find build/app/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          if ! find "$GITHUB_WORKSPACE/output" \
              -type f \
              -name "*.apk" \
              | grep -q .; then

            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          echo
          echo "APK:"
          ls -lh "$GITHUB_WORKSPACE"/output/*.apk

      - name: "21 • Upload APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

      - name: "22 • Diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.jobId }}
          path: |
            ${{ env.PROJECT_ROOT }}/flutter_build.log
            ${{ env.PROJECT_ROOT }}/flutter_doctor.log
            ${{ env.PROJECT_ROOT }}/flutter_suggestions.log
            ${{ env.PROJECT_ROOT }}/pubspec.yaml
            ${{ env.PROJECT_ROOT }}/pubspec.lock
            ${{ env.PROJECT_ROOT }}/.metadata
            ${{ env.PROJECT_ROOT }}/android/gradle/wrapper/gradle-wrapper.properties
            ${{ env.PROJECT_ROOT }}/android/build.gradle
            ${{ env.PROJECT_ROOT }}/android/build.gradle.kts
            ${{ env.PROJECT_ROOT }}/android/settings.gradle
            ${{ env.PROJECT_ROOT }}/android/settings.gradle.kts
            ${{ env.PROJECT_ROOT }}/android/app/build.gradle
            ${{ env.PROJECT_ROOT }}/android/app/build.gradle.kts
            ${{ env.PROJECT_ROOT }}/android/app/src/main/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
          overwrite: true
