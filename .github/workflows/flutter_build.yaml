name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flutter-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    name: Adaptive Flutter APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:

      - name: "01 • Worker start"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " WEB TO APK BY ZIPERR"
          echo " ADAPTIVE FLUTTER WORKER"
          echo "=========================================="
          echo "Job ID : ${{ inputs.jobId }}"
          echo "User ID: ${{ inputs.userId }}"
          echo "=========================================="

      - name: "02 • Parse payload"
        shell: bash
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("PAYLOAD", "").strip()

          if not raw:
              raise SystemExit("ERROR: payload kosong")

          try:
              data = json.loads(raw)
          except Exception as e:
              raise SystemExit(
                  f"ERROR: payload JSON invalid: {e}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: payload harus object JSON"
              )

          url = (
              data.get("url")
              or data.get("sourceUrl")
              or data.get("source_url")
              or data.get("zipUrl")
              or data.get("zip_url")
          )

          if not url:
              raise SystemExit(
                  "ERROR: source ZIP URL tidak ditemukan"
              )

          build_type = str(
              data.get("buildType")
              or data.get("build_type")
              or "release"
          ).lower().strip()

          if build_type not in (
              "release",
              "debug",
              "profile"
          ):
              build_type = "release"

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SOURCE_URL={url}\n")
              f.write(f"BUILD_TYPE={build_type}\n")

          print("Payload: OK")
          print("Build type:", build_type)
          PY

      - name: "03 • Download source ZIP"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf source.zip source project

          test -n "${SOURCE_URL:-}"

          echo "Downloading source..."

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "$SOURCE_URL" \
            -o source.zip

          test -f source.zip

          SIZE="$(stat -c%s source.zip)"

          echo "ZIP size: ${SIZE} bytes"

          if [ "$SIZE" -lt 1024 ]; then
            echo "ERROR: source ZIP terlalu kecil"
            file source.zip || true
            exit 1
          fi

      - name: "04 • Validate ZIP"
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath

          if not zipfile.is_zipfile("source.zip"):
              raise SystemExit(
                  "ERROR: source.zip bukan ZIP valid"
              )

          with zipfile.ZipFile("source.zip") as z:

              bad = z.testzip()

              if bad:
                  raise SystemExit(
                      f"ERROR: ZIP corrupt: {bad}"
                  )

              for item in z.infolist():

                  name = item.filename.replace("\\", "/")
                  p = PurePosixPath(name)

                  if name.startswith("/"):
                      raise SystemExit(
                          f"ERROR: absolute path: {name}"
                      )

                  if ".." in p.parts:
                      raise SystemExit(
                          f"ERROR: path traversal: {name}"
                      )

          print("ZIP validation: OK")
          PY

      - name: "05 • Extract source"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source

          unzip -q source.zip -d source

          test -d source

          echo "Source extracted."

      - name: "06 • Locate Flutter project"
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          while IFS= read -r pubspec; do

            DIR="$(dirname "$pubspec")"

            if [ -d "$DIR/lib" ] &&
               [ -d "$DIR/android" ]; then

              PROJECT_ROOT="$DIR"
              break
            fi

          done < <(
            find "$PWD/source" \
              -type f \
              -name pubspec.yaml \
              | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Flutter project tidak ditemukan."
            find source \
              -type f \
              -name pubspec.yaml \
              -print || true
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_ROOT"

      - name: "07 • Detect Flutter SDK version"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          FLUTTER_VERSION=""

          # Prioritas 1:
          # .metadata menyimpan versi Flutter yang
          # digunakan saat project dibuat.
          if [ -f ".metadata" ]; then

            FLUTTER_VERSION="$(
              python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path(".metadata").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          patterns = [
              r"version:\s*([0-9]+\.[0-9]+\.[0-9]+)",
              r"version:\s*([0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.+-]+)"
          ]

          for pattern in patterns:
              m = re.search(pattern, text)

              if m:
                  print(m.group(1))
                  break
          PY
            )"

          fi

          # Prioritas 2:
          # environment.flutter pada pubspec.
          if [ -z "$FLUTTER_VERSION" ] &&
             [ -f pubspec.yaml ]; then

            FLUTTER_VERSION="$(
              python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("pubspec.yaml").read_text(
              encoding="utf-8",
              errors="ignore"
          )

          m = re.search(
              r'(?m)^\s*sdk:\s*[><=~^]*\s*([0-9]+\.[0-9]+)',
              text
          )

          if m:
              print(m.group(1))
          PY
            )"
          fi

          # Jika hanya major.minor yang ditemukan,
          # jangan menebak patch version.
          if [[ "$FLUTTER_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            FLUTTER_VERSION=""
          fi

          if [ -n "$FLUTTER_VERSION" ]; then
            echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"

            echo "=========================================="
            echo " BASE FLUTTER VERSION DETECTED"
            echo "=========================================="
            echo "$FLUTTER_VERSION"
            echo "=========================================="
          else
            echo "FLUTTER_VERSION=" >> "$GITHUB_ENV"

            echo "No exact Flutter version found."
            echo "Worker will use compatibility fallback."
          fi

      - name: "08 • Setup Flutter matching base"
        if: env.FLUTTER_VERSION != ''
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: "09 • Setup Flutter fallback"
        if: env.FLUTTER_VERSION == ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: "10 • Verify Flutter"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " FLUTTER SDK"
          echo "=========================================="

          flutter --version
          dart --version

          echo
          echo "Flutter SDK:"
          which flutter

          echo
          echo "Expected base version:"
          echo "${FLUTTER_VERSION:-not detected}"

      - name: "11 • Detect Gradle / AGP / Kotlin"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper tidak ditemukan"
            exit 1
          fi

          GRADLE_VERSION="$(
            python3 - "$WRAPPER" <<'PY'
          import re
          import sys

          text = open(
              sys.argv[1],
              encoding="utf-8",
              errors="ignore"
          ).read()

          m = re.search(
              r"gradle-([0-9]+(?:\.[0-9]+){1,2})-",
              text
          )

          print(m.group(1) if m else "")
          PY
          )"

          AGP_VERSION="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts")
          ]

          patterns = [
              r'com\.android\.application["\']?\s*version\s*["\']([0-9.]+)["\']',
              r'com\.android\.tools\.build:gradle:([0-9.]+)',
              r'id\s*\(\s*["\']com\.android\.application["\']\s*\)\s*version\s*["\']([0-9.]+)["\']'
          ]

          for p in files:

              if not p.exists():
                  continue

              text = p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              for pattern in patterns:

                  m = re.search(
                      pattern,
                      text,
                      re.I | re.S
                  )

                  if m:
                      print(m.group(1))
                      raise SystemExit

          print("")
          PY
          )"

          KOTLIN_VERSION="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts")
          ]

          patterns = [
              r'kotlin.*?version\s*[=:]\s*["\']([0-9.]+)["\']',
              r'kotlin_version\s*=\s*["\']([0-9.]+)["\']',
              r'kotlin-gradle-plugin:([0-9.]+)'
          ]

          for p in files:

              if not p.exists():
                  continue

              text = p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              for pattern in patterns:

                  m = re.search(
                      pattern,
                      text,
                      re.I | re.S
                  )

                  if m:
                      print(m.group(1))
                      raise SystemExit

          print("")
          PY
          )"

          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"
          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"
          echo "KOTLIN_VERSION=$KOTLIN_VERSION" >> "$GITHUB_ENV"

          echo
          echo "Gradle : ${GRADLE_VERSION:-unknown}"
          echo "AGP    : ${AGP_VERSION:-unknown}"
          echo "Kotlin : ${KOTLIN_VERSION:-unknown}"

      - name: "12 • Select Java for Gradle"
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GRADLE_VERSION:-0}"

          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"

          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"

          # Gradle < 7.3 -> Java 11
          if [ "$MAJOR" -lt 7 ] ||
             { [ "$MAJOR" -eq 7 ] && [ "$MINOR" -lt 3 ]; }; then

            JAVA_VERSION="11"

          # Gradle 7.3 through 8.x -> Java 17
          else

            JAVA_VERSION="17"

          fi

          echo "JAVA_VERSION=$JAVA_VERSION" >> "$GITHUB_ENV"

          echo "Selected Java: $JAVA_VERSION"

      - name: "13 • Setup Java"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: "14 • Verify Java"
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version

      - name: "15 • Preserve original Android project"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf android.worker-original

          cp -a android android.worker-original

          echo "Original Android project backed up."

      - name: "16 • Prepare Gradle"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x android/gradlew

          echo "=========================================="
          echo " ORIGINAL GRADLE"
          echo "=========================================="

          ./android/gradlew --version

      - name: "17 • Flutter compatibility check"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter doctor -v

          echo
          echo "Flutter suggestions:"

          flutter analyze --suggestions \
            2>&1 | tee flutter_suggestions.log || true

      - name: "18 • Flutter pub get"
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          flutter pub get

      - name: "19 • Build original project"
        id: build_original
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_ROOT"

          rm -f flutter_build.log

          echo "=========================================="
          echo " BUILDING BASE WITH ITS OWN TOOLCHAIN"
          echo "=========================================="

          echo "Flutter :"
          flutter --version

          echo
          echo "Gradle:"
          ./android/gradlew --version

          echo
          echo "AGP    : ${AGP_VERSION:-unknown}"
          echo "Kotlin : ${KOTLIN_VERSION:-unknown}"
          echo "Java   : ${JAVA_VERSION}"

          case "$BUILD_TYPE" in

            debug)
              flutter build apk \
                --debug \
                --no-pub \
                2>&1 | tee flutter_build.log
              ;;

            profile)
              flutter build apk \
                --profile \
                --no-pub \
                2>&1 | tee flutter_build.log
              ;;

            *)
              flutter build apk \
                --release \
                --no-pub \
                2>&1 | tee flutter_build.log
              ;;

          esac

      - name: "20 • Controlled compatibility repair"
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo " ORIGINAL BUILD FAILED"
          echo " CONTROLLED REPAIR"
          echo "=========================================="

          echo
          echo "IMPORTANT:"
          echo "Tidak mengganti AGP ke 9."
          echo "Tidak mengganti Gradle secara membabi-buta."
          echo "Tidak mengganti Flutter SDK."

          # Restore original Android project first.
          rm -rf android
          cp -a android.worker-original android

          chmod +x android/gradlew

          # Generate fresh Flutter Android migration
          # only when the Flutter SDK explicitly supports
          # the current project structure.
          flutter pub get

          echo
          echo "Retrying original project..."

      - name: "21 • Retry APK"
        if: failure()
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_ROOT"

          rm -f flutter_build_retry.log

          case "$BUILD_TYPE" in

            debug)
              flutter build apk \
                --debug \
                --no-pub \
                2>&1 | tee flutter_build_retry.log
              ;;

            profile)
              flutter build apk \
                --profile \
                --no-pub \
                2>&1 | tee flutter_build_retry.log
              ;;

            *)
              flutter build apk \
                --release \
                --no-pub \
                2>&1 | tee flutter_build_retry.log
              ;;

          esac

      - name: "22 • Collect APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf "$GITHUB_WORKSPACE/output"
          mkdir -p "$GITHUB_WORKSPACE/output"

          find build/app/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          if ! find "$GITHUB_WORKSPACE/output" \
              -type f \
              -name "*.apk" \
              | grep -q .; then

            echo "ERROR: APK tidak ditemukan"

            find build \
              -type f \
              | head -n 100

            exit 1
          fi

          echo "=========================================="
          echo " APK SUCCESS"
          echo "=========================================="

          ls -lh "$GITHUB_WORKSPACE"/output/*.apk

      - name: "23 • Upload APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

      - name: "24 • Diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.jobId }}
          path: |
            ${{ env.PROJECT_ROOT }}/flutter_build.log
            ${{ env.PROJECT_ROOT }}/flutter_build_retry.log
            ${{ env.PROJECT_ROOT }}/flutter_suggestions.log
            ${{ env.PROJECT_ROOT }}/pubspec.yaml
            ${{ env.PROJECT_ROOT }}/pubspec.lock
            ${{ env.PROJECT_ROOT }}/.metadata
            ${{ env.PROJECT_ROOT }}/android/gradle/wrapper/gradle-wrapper.properties
            ${{ env.PROJECT_ROOT }}/android/build.gradle
            ${{ env.PROJECT_ROOT }}/android/build.gradle.kts
            ${{ env.PROJECT_ROOT }}/android/settings.gradle
            ${{ env.PROJECT_ROOT }}/android/settings.gradle.kts
            ${{ env.PROJECT_ROOT }}/android/app/build.gradle
            ${{ env.PROJECT_ROOT }}/android/app/build.gradle.kts
            ${{ env.PROJECT_ROOT }}/android/app/src/main/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
          overwrite: true
