name: Web2APK Build

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "SC Build Job ID"
        required: true
        type: string
      userId:
        description: "Telegram User ID"
        required: true
        type: string
      payload:
        description: "SC Build JSON payload"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: web2apk-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}

    steps:
      - name: 01 - Initialize
        run: |
          set -euo pipefail
          echo "SC BUILD - WEB2APK WORKER"
          echo "Job ID: $JOB_ID"
          echo "User ID: $USER_ID"
          echo "Run ID: $GITHUB_RUN_ID"

      - name: 02 - Parse payload
        id: payload
        shell: bash
        env:
          RAW_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RAW_PAYLOAD"])

          url = str(data.get("url", "")).strip()
          app_name = str(data.get("appName", "WebApp")).strip()
          icon_url = str(data.get("iconUrl", "")).strip()

          tag = str(
              data.get("jobId")
              or data.get("tag")
              or os.environ.get("GITHUB_RUN_ID")
          ).strip()

          if not url:
              raise SystemExit("payload.url kosong")

          if not url.startswith(("http://", "https://")):
              raise SystemExit("payload.url harus http:// atau https://")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"url={url}\n")
              f.write(f"app_name={app_name or 'WebApp'}\n")
              f.write(f"icon_url={icon_url}\n")
              f.write(f"tag={tag}\n")
          PY

      - name: 03 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 04 - Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 05 - Create Flutter project
        run: |
          set -euo pipefail

          rm -rf webapp

          flutter create \
            --org com.scbuild.web2apk \
            --project-name web2apk_app \
            webapp

      - name: 06 - Add WebView
        working-directory: webapp
        run: |
          flutter pub add webview_flutter

      - name: 07 - Create WebView app
        working-directory: webapp
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const webUrl = String.fromEnvironment(
            'WEB_URL',
            defaultValue: 'https://example.com',
          );

          void main() {
            runApp(const Web2APK());
          }

          class Web2APK extends StatelessWidget {
            const Web2APK({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: const BrowserPage(),
              );
            }
          }

          class BrowserPage extends StatefulWidget {
            const BrowserPage({super.key});

            @override
            State<BrowserPage> createState() => _BrowserPageState();
          }

          class _BrowserPageState extends State<BrowserPage> {
            late final WebViewController controller;
            bool loading = true;

            @override
            void initState() {
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted,
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (_) {
                      if (mounted) {
                        setState(() => loading = true);
                      }
                    },
                    onPageFinished: (_) {
                      if (mounted) {
                        setState(() => loading = false);
                      }
                    },
                  ),
                )
                ..loadRequest(
                  Uri.parse(webUrl),
                );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(
                        controller: controller,
                      ),
                      if (loading)
                        const Center(
                          child: CircularProgressIndicator(),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: 08 - Set application name
        working-directory: webapp
        env:
          APP_NAME: ${{ steps.payload.outputs.app_name }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from xml.sax.saxutils import escape

          path = "android/app/src/main/AndroidManifest.xml"
          name = escape(os.environ["APP_NAME"])

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          data, count = re.subn(
              r'android:label="[^"]*"',
              f'android:label="{name}"',
              data,
              count=1,
          )

          if count == 0:
              raise SystemExit("android:label tidak ditemukan")

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)
          PY

      - name: 09 - Install icon
        if: ${{ steps.payload.outputs.icon_url != '' }}
        working-directory: webapp
        env:
          ICON_URL: ${{ steps.payload.outputs.icon_url }}
        run: |
          set -euo pipefail

          mkdir -p assets/icon

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            -o assets/icon/icon.png \
            "$ICON_URL"

          flutter pub add --dev flutter_launcher_icons

          cat >> pubspec.yaml <<'EOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
          EOF

          flutter pub get
          dart run flutter_launcher_icons

      - name: 10 - Flutter pub get
        working-directory: webapp
        run: |
          flutter pub get

      - name: 11 - Build Web2APK
        working-directory: webapp
        env:
          WEB_URL: ${{ steps.payload.outputs.url }}
          APP_NAME: ${{ steps.payload.outputs.app_name }}
        run: |
          set -euo pipefail

          flutter build apk \
            --release \
            --dart-define="WEB_URL=$WEB_URL" \
            --dart-define="APP_NAME=$APP_NAME"

      - name: 12 - Collect APK
        id: apk
        env:
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          set -euo pipefail

          APK="$(
            find webapp/build/app/outputs \
              -type f \
              -name "*.apk" \
              -print \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          mkdir -p output

          SAFE_TAG="$(echo "$TAG" | tr -c 'A-Za-z0-9._-' '_')"
          DEST="output/web2apk-${SAFE_TAG}.apk"

          cp "$APK" "$DEST"

          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=web2apk-${SAFE_TAG}" >> "$GITHUB_OUTPUT"

      - name: 13 - Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 2
