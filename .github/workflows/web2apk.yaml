name: Web To APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique build job ID"
        required: true
        type: string
      userId:
        description: "Telegram user ID"
        required: true
        type: string
      payload:
        description: "Build payload JSON"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: web2apk-${{ inputs.jobId }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Web To APK Build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: "01 • Worker information"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " WEB TO APK BY ZIPERR"
          echo " Web2APK Worker"
          echo "=========================================="
          echo "Job ID : ${{ inputs.jobId }}"
          echo "User ID: ${{ inputs.userId }}"
          echo "=========================================="

      - name: "02 • Parse payload"
        shell: bash
        env:
          BUILD_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("BUILD_PAYLOAD", "").strip()

          if not raw:
              raise SystemExit("ERROR: payload kosong")

          try:
              data = json.loads(raw)
          except Exception as e:
              raise SystemExit(
                  f"ERROR: payload JSON invalid: {e}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: payload harus berupa JSON object"
              )

          url = (
              data.get("url")
              or data.get("webUrl")
              or data.get("web_url")
              or data.get("website")
              or data.get("site")
          )

          if not url:
              raise SystemExit(
                  "ERROR: URL website tidak ditemukan di payload"
              )

          url = str(url).strip()

          if not (
              url.startswith("http://")
              or url.startswith("https://")
          ):
              raise SystemExit(
                  "ERROR: URL website harus http:// atau https://"
              )

          app_name = str(
              data.get("appName")
              or data.get("app_name")
              or data.get("name")
              or "Web APK"
          ).strip()

          package_name = str(
              data.get("packageName")
              or data.get("package_name")
              or "com.duta.webapk"
          ).strip().lower()

          import re

          if not re.fullmatch(
              r"[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+",
              package_name
          ):
              package_name = "com.duta.webapk"

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("WEB_URL=" + url + "\n")
              f.write("APP_NAME=" + app_name.replace("\n", " ") + "\n")
              f.write("PACKAGE_NAME=" + package_name + "\n")

          print("Website URL : OK")
          print("App name    :", app_name)
          print("Package     :", package_name)
          PY

      - name: "03 • Setup Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: "04 • Verify Java"
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version

          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"

      - name: "05 • Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: "06 • Verify Flutter / Dart / Android"
        shell: bash
        run: |
          set -euo pipefail

          flutter --version
          dart --version

          flutter doctor -v

          flutter precache --android

          test -x "$(command -v flutter)"
          test -x "$(command -v dart)"

      - name: "07 • Create Flutter project"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project

          flutter create \
            --platforms=android \
            --org="$PACKAGE_NAME" \
            project

          test -f project/pubspec.yaml
          test -d project/android
          test -d project/lib

      - name: "08 • Add WebView dependency"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          flutter pub add webview_flutter

          flutter pub get

      - name: "09 • Generate application"
        shell: bash
        env:
          GENERATED_URL: ${{ env.WEB_URL }}
          GENERATED_APP_NAME: ${{ env.APP_NAME }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          url = os.environ["GENERATED_URL"]
          app_name = os.environ["GENERATED_APP_NAME"]

          # json.dumps menghasilkan Dart string literal yang aman
          dart_url = json.dumps(url, ensure_ascii=False)
          dart_name = json.dumps(app_name, ensure_ascii=False)

          code = f'''import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {{
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const WebApp());
          }}

          class WebApp extends StatefulWidget {{
            const WebApp({{super.key}});

            @override
            State<WebApp> createState() => _WebAppState();
          }}

          class _WebAppState extends State<WebApp> {{
            late final WebViewController controller;

            @override
            void initState() {{
              super.initState();

              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onWebResourceError: (error) {{
                      debugPrint(
                        'Web error: ${{error.description}}',
                      );
                    }},
                  ),
                )
                ..loadRequest(
                  Uri.parse({dart_url}),
                );
            }}

            @override
            Widget build(BuildContext context) {{
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: {dart_name},
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(
                      controller: controller,
                    ),
                  ),
                ),
              );
            }}
          }}
          '''

          os.makedirs("project/lib", exist_ok=True)

          with open(
              "project/lib/main.dart",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(code)

          print("main.dart generated")
          PY

      - name: "10 • Verify AndroidManifest"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          try:
              tree = ET.parse(path)
          except Exception as e:
              raise SystemExit(
                  f"ERROR: AndroidManifest.xml invalid: {e}"
              )

          root = tree.getroot()

          if root.tag != "manifest":
              raise SystemExit(
                  "ERROR: AndroidManifest root invalid"
              )

          android_ns = "http://schemas.android.com/apk/res/android"
          permission = (
              "{"
              + android_ns
              + "}name"
          )

          internet = "android.permission.INTERNET"

          exists = False

          for node in root.findall("uses-permission"):
              if node.get(permission) == internet:
                  exists = True
                  break

          if not exists:
              ET.register_namespace("android", android_ns)

              node = ET.Element(
                  "uses-permission",
                  {
                      permission: internet
                  }
              )

              root.insert(0, node)
              tree.write(
                  path,
                  encoding="utf-8",
                  xml_declaration=True
              )

              print("INTERNET permission added")
          else:
              print("INTERNET permission already exists")
          PY

          grep -q "android.permission.INTERNET" "$MANIFEST"

      - name: "11 • Repair Gradle wrapper"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          test -f "$WRAPPER"

          CURRENT="$(
            python3 - "$WRAPPER" <<'PY'
          import re
          import sys

          text = open(
              sys.argv[1],
              encoding="utf-8"
          ).read()

          m = re.search(
              r"distributionUrl=.*gradle-([0-9]+(?:\.[0-9]+){1,2})-",
              text
          )

          print(m.group(1) if m else "")
          PY
          )"

          echo "Current Gradle: ${CURRENT:-unknown}"

          python3 - "$WRAPPER" "$CURRENT" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          current = sys.argv[2]

          def version(s):
              try:
                  return tuple(
                      int(x)
                      for x in s.split(".")
                  )
              except Exception:
                  return (0,)

          minimum = version("8.14.0")
          current_v = (
              version(current)
              if current
              else (0,)
          )

          if current_v < minimum:
              text = open(
                  path,
                  encoding="utf-8"
              ).read()

              text = re.sub(
                  r"gradle-[0-9]+(?:\.[0-9]+){1,2}-",
                  "gradle-8.14.3-",
                  text
              )

              open(
                  path,
                  "w",
                  encoding="utf-8"
              ).write(text)

              print(
                  "Gradle wrapper patched to 8.14.3"
              )
          else:
              print(
                  "Gradle wrapper already compatible"
              )
          PY

          chmod +x android/gradlew

          ./android/gradlew --version

      - name: "12 • Flutter clean"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          flutter clean

      - name: "13 • Flutter dependencies"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          flutter pub get

      - name: "14 • Final preflight"
        shell: bash
        run: |
          set -euo pipefail

          cd project

          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

          flutter --version
          dart --version

          ./android/gradlew --version

          flutter analyze lib/main.dart

          echo "Web2APK preflight: PASSED"

      - name: "15 • Build APK"
        shell: bash
        run: |
          set -o pipefail

          cd project

          rm -f flutter_build.log

          flutter build apk \
            --release \
            --no-pub \
            2>&1 | tee flutter_build.log

      - name: "16 • Collect APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          find project/build/app/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} output/ \;

          if ! find output \
              -type f \
              -name "*.apk" \
              | grep -q .; then
            echo "ERROR: APK tidak ditemukan"
            find project/build \
              -type f \
              | head -n 100
            exit 1
          fi

          ls -lh output/*.apk

      - name: "17 • Upload APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

      - name: "18 • Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.jobId }}
          path: |
            project/flutter_build.log
            project/pubspec.yaml
            project/pubspec.lock
            project/android/gradle/wrapper/gradle-wrapper.properties
            project/android/app/src/main/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
          overwrite: true
