name: DUTA Web2APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Build job ID
        required: true
        type: string
      userId:
        description: Telegram user ID
        required: true
        type: string
      payload:
        description: JSON payload from DUTA bot
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: duta-web2apk-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

    steps:
      - name: 01 • Checkout
        uses: actions/checkout@v4

      - name: 02 • Parse payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          raw = os.environ.get("PAYLOAD", "")
          try:
              p = json.loads(raw)
          except Exception as exc:
              print(f"Invalid payload JSON: {exc}")
              sys.exit(1)
          url = str(p.get("url", "")).strip()
          name = str(p.get("appName", "Duta Web App")).strip() or "Duta Web App"
          icon = str(p.get("iconUrl", "")).strip()
          if not (url.startswith("http://") or url.startswith("https://")):
              print("Payload URL must start with http:// or https://")
              sys.exit(1)
          def envsafe(v: str) -> str:
              return v.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"WEB_URL={envsafe(url)}\n")
              f.write(f"APP_NAME={envsafe(name[:60])}\n")
              f.write(f"ICON_URL={envsafe(icon)}\n")
          print(f"URL={url}")
          print(f"APP_NAME={name}")
          PY

      - name: 03 • Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 04 • Install Android SDK (cmdline-tools)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls -la "$ANDROID_HOME"

      - name: 05 • Download icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/drawable
          if [[ -n "${ICON_URL:-}" ]]; then
            echo "Downloading icon: $ICON_URL"
            if curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
                -A 'DUTA-BOT-APPS/1.0' "$ICON_URL" -o app_icon.png; then
              file app_icon.png || true
              # Resize / convert to PNG if needed (ImageMagick available on ubuntu-latest)
              if command -v convert >/dev/null 2>&1; then
                convert app_icon.png -resize 192x192 app/src/main/res/mipmap-hdpi/ic_launcher.png || cp app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
              else
                cp app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
              fi
            else
              echo "Icon download failed, will use default"
            fi
          fi
          # Default icon if missing
          if [[ ! -f app/src/main/res/mipmap-hdpi/ic_launcher.png ]]; then
            python3 - <<'PY'
          from pathlib import Path
          # Minimal valid 1x1 PNG (will work as placeholder)
          import struct, zlib
          def png(w, h, rgb=(33,150,243)):
              def chunk(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(rgb)*w for _ in range(h))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          Path('app/src/main/res/mipmap-hdpi/ic_launcher.png').write_bytes(png(192, 192))
          print('Default icon written')
          PY
          fi

      - name: 06 • Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/duta/web2apk
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'DutaWebAPK'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.defaults.buildfeatures.buildconfig=true
          EOF

          # local.properties for SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.duta.web2apk'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.duta.web2apk'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      // Use debug keystore so APK is installable without custom key
                      signingConfig signingConfigs.debug
                  }
              }

              packaging {
                  resources {
                      excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          # Manifest — label & icon
          python3 - <<'PY'
          import os, html
          name = html.escape(os.environ.get("APP_NAME", "Web App"), quote=True)
          manifest = f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:label="{name}"
                android:icon="@mipmap/ic_launcher"
                android:theme="@style/AppTheme"
                android:usesCleartextTraffic="true"
                android:allowBackup="false"
                android:supportsRtl="true"
                android:hardwareAccelerated="true">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          '''
          open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8').write(manifest)
          print('Manifest written')
          PY

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="android:statusBarColor">#2196F3</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="colorPrimary">#2196F3</item>
              <item name="colorPrimaryDark">#1976D2</item>
              <item name="colorAccent">#2196F3</item>
            </style>
          </resources>
          EOF

          # strings.xml
          python3 - <<'PY'
          import os, html
          name = html.escape(os.environ.get("APP_NAME", "Web App"))
          url  = html.escape(os.environ.get("WEB_URL", "https://example.com"))
          open('app/src/main/res/values/strings.xml', 'w', encoding='utf-8').write(f'''<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">{name}</string>
            <string name="web_url" translatable="false">{url}</string>
          </resources>
          ''')
          print('strings.xml written')
          PY

          cat > app/src/main/java/com/duta/web2apk/MainActivity.java <<'EOF'
          package com.duta.web2apk;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl(getString(R.string.web_url));
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          echo "Project generated OK"
          find . -maxdepth 4 -type f | head -40

      - name: 07 • Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 08 • Build APK (release + debug signing)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleRelease
          echo "=== APK output ==="
          find app/build/outputs -name "*.apk" -type f -ls || true

      - name: 09 • Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 2

      - name: 10 • Diagnostics on failure
        if: failure()
        run: |
          echo '--- build diagnostics ---'
          java -version || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" 2>/dev/null || true
          ls -la "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls -la "$ANDROID_HOME/build-tools" 2>/dev/null || true
          gradle --version || true
          find . -maxdepth 5 -type f | sort | head -100 || true
          cat local.properties 2>/dev/null || true
          cat app/build.gradle 2>/dev/null || true
