name: Web To APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique build job ID"
        required: true
        type: string
      userId:
        description: "Telegram user ID"
        required: true
        type: string
      payload:
        description: "Build payload JSON (url, appName, packageName)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: web2apk-${{ inputs.jobId }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Web To APK Build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: "01 • Worker information"
        shell: bash
        run: |
          set -euo pipefail
          echo "=========================================="
          echo " WEB TO APK WORKER"
          echo "=========================================="
          echo "Job ID : ${{ inputs.jobId }}"
          echo "User ID: ${{ inputs.userId }}"
          echo "=========================================="

      - name: "02 • Parse payload"
        shell: bash
        env:
          BUILD_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re

          raw = os.environ.get("BUILD_PAYLOAD", "").strip()
          if not raw:
              raise SystemExit("ERROR: payload kosong")

          try:
              data = json.loads(raw)
          except Exception as e:
              raise SystemExit(f"ERROR: payload JSON invalid: {e}")

          if not isinstance(data, dict):
              raise SystemExit("ERROR: payload harus JSON object")

          url = (
              data.get("url")
              or data.get("webUrl")
              or data.get("web_url")
              or data.get("website")
              or data.get("site")
              or ""
          )
          url = str(url).strip()
          if not url:
              raise SystemExit("ERROR: URL website tidak ditemukan di payload")
          if not (url.startswith("http://") or url.startswith("https://")):
              raise SystemExit("ERROR: URL harus http:// atau https://")

          app_name = str(
              data.get("appName")
              or data.get("app_name")
              or data.get("name")
              or "Web APK"
          ).strip() or "Web APK"
          app_name = app_name.replace("\n", " ").replace("\r", " ")[:60]

          package_name = str(
              data.get("packageName")
              or data.get("package_name")
              or "com.duta.webapk"
          ).strip().lower()
          if not re.fullmatch(r"[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+", package_name):
              package_name = "com.duta.webapk"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"WEB_URL={url}\n")
              f.write(f"APP_NAME={app_name}\n")
              f.write(f"PACKAGE_NAME={package_name}\n")

          print("Website URL :", url)
          print("App name    :", app_name)
          print("Package     :", package_name)
          PY

      - name: "03 • Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "04 • Verify Java"
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: "05 • Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: "06 • Verify Flutter"
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          flutter precache --android
          flutter doctor -v || true

      - name: "07 • Create Flutter project"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project

          # com.duta.panel → org=com.duta  project-name=panel
          ORG="$(echo "$PACKAGE_NAME" | awk -F. 'BEGIN{OFS="."} {if(NF>1){NF=NF-1; print} else print "com.duta"}')"
          PNAME="$(echo "$PACKAGE_NAME" | awk -F. '{print $NF}' | tr -cd 'a-z0-9_')"
          [ -n "$PNAME" ] || PNAME="webapk"
          [ -n "$ORG" ] || ORG="com.duta"

          echo "ORG=$ORG PNAME=$PNAME PACKAGE=$PACKAGE_NAME"

          flutter create \
            --platforms=android \
            --org="$ORG" \
            --project-name="$PNAME" \
            project

          # applicationId + namespace (Groovy atau Kotlin DSL)
          for GF in project/android/app/build.gradle project/android/app/build.gradle.kts; do
            [ -f "$GF" ] || continue
            if [[ "$GF" == *.kts ]]; then
              sed -i 's/applicationId\s*=\s*".*"/applicationId = "'"$PACKAGE_NAME"'"/' "$GF" || true
              sed -i 's/namespace\s*=\s*".*"/namespace = "'"$PACKAGE_NAME"'"/' "$GF" || true
            else
              sed -i 's/applicationId\s*["'"'"'].*["'"'"']/applicationId "'"$PACKAGE_NAME"'"/' "$GF" || true
              sed -i 's/namespace\s*["'"'"'].*["'"'"']/namespace "'"$PACKAGE_NAME"'"/' "$GF" || true
              sed -i 's/applicationId\s*=\s*".*"/applicationId = "'"$PACKAGE_NAME"'"/' "$GF" || true
              sed -i 's/namespace\s*=\s*".*"/namespace = "'"$PACKAGE_NAME"'"/' "$GF" || true
            fi
          done

          # minSdk >= 21
          for GF in project/android/app/build.gradle project/android/app/build.gradle.kts; do
            [ -f "$GF" ] || continue
            sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 21/' "$GF" || true
            sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 21/' "$GF" || true
          done

          test -f project/pubspec.yaml
          test -d project/android
          test -d project/lib

      - name: "08 • Add WebView dependency"
        shell: bash
        run: |
          set -euo pipefail
          cd project
          flutter pub add webview_flutter
          flutter pub get

      - name: "09 • Generate main.dart"
        shell: bash
        env:
          GENERATED_URL: ${{ env.WEB_URL }}
          GENERATED_APP_NAME: ${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          url = os.environ["GENERATED_URL"]
          app_name = os.environ["GENERATED_APP_NAME"]
          dart_url = json.dumps(url, ensure_ascii=False)
          dart_name = json.dumps(app_name, ensure_ascii=False)

          code = f'''import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {{
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const WebApp());
          }}

          class WebApp extends StatefulWidget {{
            const WebApp({{super.key}});

            @override
            State<WebApp> createState() => _WebAppState();
          }}

          class _WebAppState extends State<WebApp> {{
            late final WebViewController controller;

            @override
            void initState() {{
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFFFFFFFF))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onWebResourceError: (error) {{
                      debugPrint('Web error: ' + error.description);
                    }},
                  ),
                )
                ..loadRequest(Uri.parse({dart_url}));
            }}

            @override
            Widget build(BuildContext context) {{
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: {dart_name},
                home: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(controller: controller),
                  ),
                ),
              );
            }}
          }}
          '''

          os.makedirs("project/lib", exist_ok=True)
          with open("project/lib/main.dart", "w", encoding="utf-8") as f:
              f.write(code)
          print("main.dart generated OK")
          PY

      - name: "10 • AndroidManifest (INTERNET + cleartext)"
        shell: bash
        run: |
          set -euo pipefail
          cd project
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()
          if root.tag != "manifest":
              raise SystemExit("ERROR: AndroidManifest root invalid")

          NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", NS)
          name_attr = f"{{{NS}}}name"
          internet = "android.permission.INTERNET"

          has_net = any(
              n.get(name_attr) == internet
              for n in root.findall("uses-permission")
          )
          if not has_net:
              node = ET.Element("uses-permission", {name_attr: internet})
              root.insert(0, node)
              print("INTERNET permission added")
          else:
              print("INTERNET permission already exists")

          # usesCleartextTraffic untuk http://
          app = root.find("application")
          if app is not None:
              clear_attr = f"{{{NS}}}usesCleartextTraffic"
              if app.get(clear_attr) is None:
                  app.set(clear_attr, "true")
                  print("usesCleartextTraffic=true")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

          grep -q "android.permission.INTERNET" "$MANIFEST"

      - name: "11 • Repair Gradle wrapper"
        shell: bash
        run: |
          set -euo pipefail
          cd project
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          test -f "$WRAPPER"

          python3 - "$WRAPPER" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          m = re.search(r"gradle-([0-9]+(?:\.[0-9]+){1,2})-", text)
          current = m.group(1) if m else "0"

          def ver(s):
              try:
                  return tuple(int(x) for x in s.split("."))
              except Exception:
                  return (0,)

          # Minimal Gradle yang aman untuk AGP modern
          if ver(current) < ver("8.7"):
              text = re.sub(
                  r"gradle-[0-9]+(?:\.[0-9]+){1,2}-",
                  "gradle-8.11.1-",
                  text,
              )
              open(path, "w", encoding="utf-8").write(text)
              print("Gradle wrapper patched to 8.11.1")
          else:
              print("Gradle wrapper OK:", current)
          PY

          chmod +x android/gradlew
          ./android/gradlew --version || true

      - name: "12 • Flutter clean + pub get"
        shell: bash
        run: |
          set -euo pipefail
          cd project
          flutter clean
          flutter pub get

      - name: "13 • Preflight"
        shell: bash
        run: |
          set -euo pipefail
          cd project
          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          flutter analyze lib/main.dart || true
          echo "Web2APK preflight: PASSED"

      - name: "14 • Build APK"
        shell: bash
        run: |
          set -o pipefail
          cd project
          rm -f flutter_build.log
          flutter build apk --release --no-pub 2>&1 | tee flutter_build.log

      - name: "15 • Collect APK"
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find project/build/app/outputs -type f -name "*.apk" -exec cp {} output/ \;
          if ! find output -type f -name "*.apk" | grep -q .; then
            echo "ERROR: APK tidak ditemukan"
            find project/build -type f | head -n 80 || true
            exit 1
          fi
          ls -lh output/*.apk

      - name: "16 • Upload APK"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          overwrite: true

      - name: "17 • Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.jobId }}
          path: |
            project/flutter_build.log
            project/pubspec.yaml
            project/lib/main.dart
            project/android/gradle/wrapper/gradle-wrapper.properties
            project/android/app/src/main/AndroidManifest.xml
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
          overwrite: true
