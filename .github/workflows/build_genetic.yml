# DUTA Genetic v6 — + generate_icons.py (mipmap) sebelum Gradle
name: DUTA Genetic APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: false
        default: "0"
        type: string
      payload:
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: duta-genetic-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JOB_ID: ${{ inputs.jobId }}
      USER_ID: ${{ inputs.userId }}
      PAYLOAD: ${{ inputs.payload }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          sudo docker image prune -af || true
          df -h /
          echo "GENETIC_WORKER_VERSION=v6-icons"

      - name: Parse payload SC bot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          p = json.loads(os.environ["PAYLOAD"])
          url = str(p.get("url", "")).strip()
          asset_api = str(p.get("assetApiUrl", "") or "").strip()
          dl_token = str(p.get("dlToken", "") or "").strip()
          mode = str(p.get("buildType", "release")).lower()
          kind = str(p.get("kind", "")).lower()
          if dl_token:
              print(f"::add-mask::{dl_token}")
          if not url.startswith(("https://", "http://")) and not asset_api.startswith("https://"):
              sys.exit("Invalid source URL")
          if mode in ("genetik", "genetic"):
              mode = "release"
          if mode not in ("debug", "release"):
              mode = "release"
          force = "android" if kind in ("genetic", "genetik") else "auto"
          def esc(s):
              return str(s).replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SOURCE_URL={esc(url)}\n")
              f.write(f"ASSET_API_URL={esc(asset_api)}\n")
              f.write(f"DL_TOKEN={esc(dl_token)}\n")
              f.write(f"BUILD_TYPE={mode}\n")
              f.write(f"FORCE_TYPE={force}\n")
          print(f"ASSET_API={bool(asset_api)} HAS_DL_TOKEN={bool(dl_token)} BUILD_TYPE={mode}")
          PY

      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input workspace output
          download_ok=false
          TOKEN="${DL_TOKEN:-${GH_TOKEN:-}}"
          [ -n "$TOKEN" ] && echo "::add-mask::${TOKEN}"

          try_dl() {
            local url="$1" label="$2"
            for i in 1 2 3 4 5 6; do
              HTTP=$(curl -sS -D /tmp/hdr -o input/source.zip -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/octet-stream" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --connect-timeout 20 --max-time 600 "$url" || echo "000")
              if [ "$HTTP" = "302" ] || [ "$HTTP" = "301" ]; then
                LOC=$(grep -i '^location:' /tmp/hdr | tail -1 | tr -d '\r' | sed 's/^[Ll]ocation: //')
                [ -n "$LOC" ] && HTTP=$(curl -sS -L -o input/source.zip -w "%{http_code}" --max-time 600 "$LOC" || echo "000")
              fi
              if [ "$HTTP" = "200" ] && unzip -t input/source.zip >/dev/null 2>&1; then
                echo "$label OK"; download_ok=true; return 0
              fi
              echo "$label attempt $i → HTTP $HTTP"
              sleep 3
            done
            return 1
          }

          [ -n "${ASSET_API_URL:-}" ] && try_dl "$ASSET_API_URL" "API" || true
          [ "$download_ok" != "true" ] && [ -n "${SOURCE_URL:-}" ] && try_dl "$SOURCE_URL" "Browser" || true
          [ "$download_ok" != "true" ] && { echo "::error::download gagal"; exit 1; }

          unzip -q input/source.zip -d workspace
          COUNT=$(find workspace -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" -eq 1 ]; then
            ONLY=$(find workspace -mindepth 1 -maxdepth 1 -type d | head -1 || true)
            if [ -n "$ONLY" ]; then
              shopt -s dotglob; mv "$ONLY"/* workspace/ 2>/dev/null || true; rmdir "$ONLY" 2>/dev/null || true
            fi
          fi
          echo "Workspace:"; find workspace -maxdepth 3 -type f | sort | head -80

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          ANDROID_HOME="${HOME}/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ] && \
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "platform-tools" "platforms;android-34" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0"
          echo "SDK ready"

      - name: Generate app icons (genetic)
        run: |
          set -euo pipefail
          # Base Genetic: generate_icons.py + *.jpg di ROOT workspace
          SCRIPT="$(find workspace -maxdepth 3 -type f -name generate_icons.py -print -quit || true)"
          if [ -z "${SCRIPT:-}" ]; then
            echo "generate_icons.py tidak ada — cek mipmap manual"
          else
            DIR="$(dirname "$SCRIPT")"
            echo "Run generate_icons.py di $DIR"
            pip install Pillow -q || pip3 install Pillow -q || true
            (cd "$DIR" && python3 generate_icons.py)
            echo "Icons generated:"
            find "$DIR/android/app/src/main/res" -name 'ic_*.png' 2>/dev/null | head -30 || true
            find workspace -path '*/mipmap-*/*' -name '*.png' 2>/dev/null | head -30 || true
          fi

          # Fallback: kalau masih belum ada mipmap, buat placeholder minimal
          if ! find workspace -type d -name 'mipmap-*' 2>/dev/null | grep -q .; then
            echo "Fallback placeholder mipmap..."
            python3 - <<'PY'
          import os
          try:
              from PIL import Image, ImageDraw
          except ImportError:
              import subprocess; subprocess.check_call(["pip","install","Pillow","-q"])
              from PIL import Image, ImageDraw
          sizes={"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          names=["ic_launcher","ic_launcher_round","ic_theme_whatsapp","ic_theme_youtube","ic_theme_instagram","ic_theme_telegram","ic_theme_xnxx"]
          # cari android app res
          base=None
          for root,dirs,files in os.walk("workspace"):
              if root.endswith("app/src/main/res") or root.endswith("app/src/main/res/"):
                  base=root; break
          if not base:
              base="workspace/android/app/src/main/res"
          os.makedirs(base, exist_ok=True)
          for dens,sz in sizes.items():
              d=os.path.join(base,f"mipmap-{dens}")
              os.makedirs(d, exist_ok=True)
              img=Image.new("RGB",(sz,sz),(8,12,16))
              dr=ImageDraw.Draw(img)
              dr.ellipse([sz//4,sz//4,3*sz//4,3*sz//4], fill=(0,212,255))
              for n in names:
                  img.save(os.path.join(d,f"{n}.png"),"PNG")
          print("placeholder icons written to", base)
          PY
          fi

      - name: Detect + locate Android
        id: detect
        run: |
          set -euo pipefail
          has_gradle=false
          find workspace -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle \) -print -quit | grep -q . && has_gradle=true
          if $has_gradle; then echo "type=android" >> "$GITHUB_OUTPUT"
          elif find workspace -name pubspec.yaml -print -quit | grep -q .; then echo "type=flutter" >> "$GITHUB_OUTPUT"
          else echo "type=unknown" >> "$GITHUB_OUTPUT"; fi

          ROOT=""
          if [ -f workspace/android/settings.gradle ] || [ -f workspace/android/gradlew ]; then ROOT="workspace/android"; fi
          [ -z "$ROOT" ] && ROOT="$(find workspace -name settings.gradle -print -quit | xargs -r dirname || true)"
          [ -z "$ROOT" ] && ROOT="$(find workspace -name gradlew -print -quit | xargs -r dirname || true)"
          if [ -n "$ROOT" ]; then
            echo "ANDROID_PROJECT=$ROOT" >> "$GITHUB_ENV"
            echo "Root: $ROOT"
            ls "$ROOT/app/src/main/res" 2>/dev/null || true
            find "$ROOT/app/src/main/res" -name 'ic_launcher*.png' 2>/dev/null | head -10 || true
          fi

      - name: Gradle bootstrap + build
        if: steps.detect.outputs.type == 'android'
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -euo pipefail
          GRADLE_VER=8.7
          mkdir -p gradle/wrapper
          [ ! -f gradle/wrapper/gradle-wrapper.jar ] && \
            curl -fsSL https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar \
              -o gradle/wrapper/gradle-wrapper.jar || true
          if [ ! -f ./gradlew ]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/g.zip
            sudo unzip -q /tmp/g.zip -d /opt
            sudo ln -sfn /opt/gradle-${GRADLE_VER}/bin/gradle /usr/local/bin/gradle
            gradle wrapper --gradle-version $GRADLE_VER || true
          fi
          [ -f gradle/wrapper/gradle-wrapper.properties ] && \
            sed -i -E "s#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-${GRADLE_VER}-all.zip#" \
              gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew 2>/dev/null || true
          if [ -n "${ANDROID_HOME:-}" ]; then echo "sdk.dir=${ANDROID_HOME}" > local.properties
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties; fi
          if [ -f app/build.gradle ] && [ "${BUILD_TYPE}" = "release" ]; then
            grep -q 'signingConfig signingConfigs.debug' app/build.gradle || \
              python3 -c "
          import re,pathlib
          p=pathlib.Path('app/build.gradle')
          t=p.read_text()
          t=re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.debug', t, count=1)
          p.write_text(t)
          " || true
          fi
          TASK=assembleDebug; [ "${BUILD_TYPE}" = "release" ] && TASK=assembleRelease
          set +e
          ./gradlew --no-daemon --stacktrace $TASK
          CODE=$?
          set -e
          if [ $CODE -ne 0 ] && [ "$TASK" = "assembleRelease" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          elif [ $CODE -ne 0 ]; then
            ./gradlew --no-daemon --stacktrace --refresh-dependencies $TASK
          fi

      - name: Collect APK
        if: steps.detect.outputs.type == 'android'
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find "$ANDROID_PROJECT" -path '*/build/outputs/apk/*' -name '*.apk' -size +10k | head -1 || true)"
          [ -z "$APK" ] && APK="$(find "$ANDROID_PROJECT" -name '*.apk' -size +10k | head -1 || true)"
          [ -z "$APK" ] && { echo "::error::APK missing"; exit 1; }
          cp "$APK" output/app.apk
          ls -lh output/app.apk

      - name: Fail unknown
        if: steps.detect.outputs.type == 'unknown'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: output/app.apk
          if-no-files-found: error
          retention-days: 2
